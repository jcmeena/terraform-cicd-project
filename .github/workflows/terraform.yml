name: "Terraform CI/CD Pipeline"
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  terraform:
    name: "Terraform Automation Engine"
    runs-on: ubuntu-latest

    steps:
      # 1. Pull the source code out of GitHub repository into the runner environment
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Configure AWS Security Access Credentials securely
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # 3. Setup the Terraform CLI tool on the remote GitHub machine
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # 4. Check that formatting meets engineering standards
      - name: Terraform Format Check
        run: terraform fmt -check

      # 5. Initialize the configuration code workspace
      - name: Terraform Init
        run: terraform init

      # 6. Execute a Plan preview on all pull requests
      - name: Terraform Plan
        if: github.event_name == 'pull_request'
        run: terraform plan -no-color

      # 7. Automatically apply the changes ONLY when merged directly to main
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve -no-color
